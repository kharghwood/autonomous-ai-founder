<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous AI Founder</title><style>body{margin:0;background:#0b1110;color:#eef7f1;font:16px system-ui}.wrap{max-width:950px;margin:auto;padding:44px 22px}.muted{color:#9eafa8}.panel{background:#121d1a;border:1px solid #273b34;border-radius:18px;padding:24px;margin:18px 0}button{background:#8be0b5;border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer}.metric{font-size:28px;font-weight:800}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c4d5cc}</style></head><body><main class="wrap"><p style="color:#8be0b5;font-weight:800;letter-spacing:.15em">LOCAL AI PRODUCT STUDIO</p><h1 style="font-size:clamp(42px,8vw,70px)">Find real problems.<br>Build useful tools.</h1><p class="muted">Research → Score → Generate → Test → Publish</p><section class="panel"><p id="state" class="muted">Checking local AI…</p><div class="metric" id="model">—</div><button id="run">Run founder cycle</button><p class="muted">Runs only on your Mac. Keep the dashboard private; the API key is stored in your local .env file.</p></section><section class="panel"><h2>Latest cycle</h2><pre id="output">No run yet.</pre></section></main><script>const $=x=>document.getElementById(x);let key='';async function init(){try{let r=await fetch('/api/status'),d=await r.json();$('state').textContent=d.ollama_online?'Ollama connected':'Ollama offline — open the Ollama app';$('model').textContent=d.model+' · '+(d.models||[]).join(', ');if(d.latest)$('output').textContent=JSON.stringify(d.latest,null,2)}catch(e){$('state').textContent='Dashboard API unavailable'}}$('run').onclick=async()=>{let k=prompt('Paste FOUNDER_API_KEY from your local .env file');if(!k)return;$('run').disabled=true;$('output').textContent='Researching and building…';try{let r=await fetch('/api/run',{method:'POST',headers:{'X-API-Key':k}});let d=await r.json();$('output').textContent=JSON.stringify(d,null,2)}catch(e){$('output').textContent=String(e)}finally{$('run').disabled=false}};init();</script></body></html>
